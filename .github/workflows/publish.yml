name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --dev
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - name: Confere se a versão do pacote bate com a tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl | head -n1)
          pkg_version=$(echo "$wheel" | sed -E 's/.*-([0-9][^-]*)-[^-]+-[^-]+-[^-]+\.whl/\1/')
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag v$tag não bate com a versão do pacote ($pkg_version) — corrija o pyproject.toml antes de criar a tag."
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
